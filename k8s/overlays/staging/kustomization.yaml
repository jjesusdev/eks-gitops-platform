apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging

resources:
  - ../../base

images:
  - name: REPLACE_WITH_ECR_URI
    newTag: latest

replicas:
  - name: app
    count: 2

patches:
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: app

configMapGenerator:
  - name: app-config
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=debug