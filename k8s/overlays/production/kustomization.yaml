apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production

resources:
  - ../../base

images:
  - name: REPLACE_WITH_ECR_URI
    newTag: prod-LATEST_SHA

replicas:
  - name: app
    count: 3

patches:
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: app

configMapGenerator:
  - name: app-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=warn